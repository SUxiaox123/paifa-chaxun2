<body>
<div class="header">
  <h1>信函派送段道查询</h1>
  <p>输入地址名称，自动匹配所属段道</p>
</div>
<div class="tabs">
  <button class="active" data-panel="search">🔍 查询</button>
  <button data-panel="browse">📋 浏览</button>
  <button data-panel="manage">⚙️ 管理</button>
</div>
<div class="panel active" id="panel-search">
  <div class="search-box">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="输入地址，支持拼音首字母如 lgz" autocomplete="off">
      <button class="clear" id="clearBtn">&times;</button>
    </div>
  </div>
  <div class="result-info" id="searchInfo"></div>
  <div class="result-list" id="searchList"></div>
</div>
<div class="panel" id="panel-browse">
  <div class="letter-bar" id="letterBar"></div>
  <div class="result-info" id="browseInfo"></div>
  <div class="result-list" id="browseList"></div>
</div>
<div class="panel" id="panel-manage">
  <div class="stats" id="stats"></div>
  <div class="manage-form">
    <h3>➕ 新增派送点</h3>
    <div class="row"><input type="text" id="newName" placeholder="派送点名称（小区/单位/路名）"></div>
    <div class="row">
      <select id="newDuan">
        <option value="1段">1段</option><option value="2段">2段</option>
        <option value="3段">3段</option><option value="4段">4段</option>
        <option value="5段">5段</option><option value="6段">6段</option>
      </select>
      <button class="btn-primary" onclick="addItem()">确认添加</button>
    </div>
  </div>
  <div class="manage-form">
    <h3>📤 数据导入导出</h3>
    <div class="manage-actions">
      <button class="btn-ghost" onclick="exportCSV()">导出 CSV</button>
      <button class="btn-ghost" onclick="document.getElementById('importFile').click()">导入 CSV</button>
      <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(event)">
    </div>
    <div class="manage-actions"><button class="btn-danger" onclick="resetData()">恢复默认数据</button></div>
  </div>
  <div class="tip">
    <strong>使用说明：</strong><br>
    ① 新增/删除的数据保存在本手机浏览器中，换手机需重新导入<br>
    ② 导出 CSV 可备份或发给管理员更新总表<br>
    ③ 导入 CSV 格式：首字母,派送点名称,所属段道<br>
    ④ 「恢复默认数据」会清除所有本地修改，回到初始数据
  </div>
  <div class="result-info">当前全部数据（点击 × 可删除）：</div>
  <div class="result-list" id="manageList"></div>
</div>

const STORAGE_KEY = 'paifa_data_v2';

function loadData(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)return JSON.parse(s);}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_DATA));}

function renderSearch(){const kw=searchInput.value.trim();let list=DATA.filter(d=>match(d,kw));if(kw)list.sort((a,b)=>{const as=a.name.startsWith(kw)?0:1,bs=b.name.startsWith(kw)?0:1;if(as!==bs)return as-bs;return a.name.localeCompare(b.name,'zh');});document.getElementById('searchInfo').textContent=kw?'找到 '+list.length+' 个匹配':'共 '+DATA.length+' 个派送点，输入关键词筛选';document.getElementById('searchList').innerHTML=list.length?list.map(item=>'<div class="result-item"><span class="name">'+item.name+'</span><span class="duan '+DUAN_COLORS[item.duan]+'">'+item.duan+'</span></div>').join(''):'<div class="empty"><div class="icon">🔍</div>未找到匹配项</div>';}

function addItem(){const name=document.getElementById('newName').value.trim();const duan=document.getElementById('newDuan').value;if(!name){alert('请输入派送点名称');return;}if(DATA.some(d=>d.name===name)){alert('该名称已存在');return;}DATA.push({name:name,duan:duan,py:name,init:name.charAt(0)});saveData();document.getElementById('newName').value='';renderManage();alert('已添加：'+name+'（'+duan+'）');}
function deleteItem(name){if(!confirm('确认删除「'+name+'」？'))return;DATA=DATA.filter(d=>d.name!==name);saveData();renderManage();renderSearch();}

function exportCSV(){let list=[...DATA].sort((a,b)=>a.init.localeCompare(b.init)||a.name.localeCompare(b.name,'zh'));let csv='\ufeff首字母,派送点名称,所属段道\n';list.forEach(d=>{csv+=d.init.charAt(0).toUpperCase()+','+d.name+','+d.duan+'\n';});const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='信函派送段道_'+new Date().toISOString().slice(0,10)+'.csv';a.click();}
function importCSV(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(ev){const text=ev.target.result;const lines=text.split(/\r?\n/).filter(l=>l.trim());const newData=[];for(let i=1;i<lines.length;i++){const parts=lines[i].split(',');if(parts.length>=3&&parts[1].trim()){newData.push({name:parts[1].trim(),duan:parts[2].trim(),py:parts[1].trim(),init:parts[1].trim().charAt(0)});}}if(newData.length===0){alert('CSV格式不正确或无数据');return;}if(confirm('导入 '+newData.length+' 条数据，将覆盖当前数据，确认？')){DATA=newData;saveData();renderManage();renderSearch();alert('导入成功');}};reader.readAsText(file,'utf-8');e.target.value='';}
